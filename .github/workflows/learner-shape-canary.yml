name: Learner shape canary

# Runs a pinned learner study against a real Claude Code binary and a local stub, and fails when
# Claude Code starts sending a request shape the gateway's served model rejects. Users' Claude
# Code auto-updates, so `latest` is checked daily alongside the last version known to work.

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        claude-code: [latest, "2.1.280"]
    name: canary (Claude Code ${{ matrix.claude-code }})
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.10.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Claude Code
        env:
          CLAUDE_CODE_VERSION: ${{ matrix.claude-code }}
        run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Claude Code version
        run: claude --version

      - name: Run learner shape canary
        run: bun run canary:learner-shape
